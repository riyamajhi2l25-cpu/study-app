<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Anatomy & Physiology Sem 1-6</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',sans-serif}</style>
</head>
<body class="bg-[#0a0a0a] text-white">
<header class="sticky top-0 z-30 bg-[#0a0a0a] border-b border-zinc-800 p-4 flex justify-between items-center">
<div><h1 class="font-bold text-lg">Anatomy & Physiology 🧬</h1><p id="subHead" class="text-[11px] text-zinc-500">Sem 1 to 6 • Visual • Fun • No Login</p></div>
<button onclick="showTab('settings')" class="bg-zinc-800 w-9 h-9 rounded-full">⚙️</button>
</header>

<nav class="flex gap-2 p-3 overflow-x-auto sticky top-[65px] bg-[#0a0a0a] z-20">
<button data-tab="learn" class="tabBtn bg-white text-black px-4 py-2 rounded-full text-sm font-bold">Learn</button>
<button data-tab="quiz" class="tabBtn bg-zinc-800 px-4 py-2 rounded-full text-sm">Quiz</button>
<button data-tab="flash" class="tabBtn bg-zinc-800 px-4 py-2 rounded-full text-sm">Flashcards</button>
<button data-tab="friends" class="tabBtn bg-zinc-800 px-4 py-2 rounded-full text-sm">Friends</button>
<button data-tab="chat" class="tabBtn bg-zinc-800 px-4 py-2 rounded-full text-sm">Chats</button>
<button data-tab="settings" class="tabBtn bg-zinc-800 px-4 py-2 rounded-full text-sm">Settings</button>
</nav>

<!-- LEARN -->
<div id="tab-learn" class="tab p-4">
<div class="flex gap-2 mb-4 overflow-x-auto">
<button class="sBtn bg-violet-600 px-3 py-1 rounded-full text-xs" data-sem="all">All Sem</button>
<button class="sBtn bg-zinc-800 px-3 py-1 rounded-full text-xs" data-sem="1">Sem1</button>
<button class="sBtn bg-zinc-800 px-3 py-1 rounded-full text-xs" data-sem="2">Sem2</button>
<button class="sBtn bg-zinc-800 px-3 py-1 rounded-full text-xs" data-sem="3">Sem3</button>
<button class="sBtn bg-zinc-800 px-3 py-1 rounded-full text-xs" data-sem="4">Sem4</button>
<button class="sBtn bg-zinc-800 px-3 py-1 rounded-full text-xs" data-sem="5">Sem5</button>
<button class="sBtn bg-zinc-800 px-3 py-1 rounded-full text-xs" data-sem="6">Sem6</button>
</div>
<div id="grid" class="grid md:grid-cols-2 gap-3"></div>
</div>

<div id="tab-quiz" class="tab hidden p-4"><div id="quizBox" class="bg-zinc-900 border border-zinc-800 p-6 rounded-[24px]"></div></div>
<div id="tab-flash" class="tab hidden p-4"><div id="flashBox" class="grid gap-3"></div></div>

<div id="tab-friends" class="tab hidden p-4 space-y-4">
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl">
<p class="font-bold text-sm">🔍 Search Nickname</p>
<div class="flex gap-2 mt-2"><input id="searchInput" class="flex-1 bg-zinc-800 p-3 rounded-xl text-sm" placeholder="e.g. ree"><button id="searchBtn" class="bg-white text-black px-4 rounded-xl text-sm font-bold">Search</button></div>
<div id="searchRes" class="mt-3"></div>
</div>
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl">
<p class="font-bold text-sm">My QR</p>
<div id="myQr" class="bg-white p-2 rounded-xl w-fit mt-3"></div>
<p id="qrLabel" class="text-xs text-zinc-500 mt-2"></p>
<button id="scanBtn" class="w-full bg-violet-600 py-3 rounded-xl font-bold mt-3">📷 Scan Friend QR</button>
<div id="reader" class="mt-3 hidden"></div>
</div>
<div class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl"><p class="font-bold text-sm">My Friends</p><div id="friendsList" class="mt-3 text-sm text-zinc-500">No friends yet</div></div>
</div>

<div id="tab-chat" class="tab hidden p-4 space-y-4">
<div class="bg-zinc-900 border border-zinc-800 p-3 rounded-2xl"><p class="font-bold text-sm">Group Chat - Anatomy Squad</p><div id="groupMsgs" class="h-[300px] overflow-y-auto bg-black p-2 rounded-xl mt-2 mb-2 text-xs space-y-2"></div><div class="flex gap-2"><input id="groupInput" class="flex-1 bg-zinc-800 p-2 rounded-xl text-sm" placeholder="Type doubt..."><button id="groupSend" class="bg-violet-600 px-4 rounded-xl">Send</button></div></div>
<div class="bg-zinc-900 border border-zinc-800 p-3 rounded-2xl"><p class="font-bold text-sm">Private: <span id="privateWith">Select friend from Friends tab</span></p><div id="privateMsgs" class="h-[300px] overflow-y-auto bg-black p-2 rounded-xl mt-2 mb-2 text-xs space-y-2"></div><div class="flex gap-2"><input id="privateInput" class="flex-1 bg-zinc-800 p-2 rounded-xl text-sm" placeholder="Message..."><button id="privateSend" class="bg-white text-black px-4 rounded-xl">Send</button></div></div>
</div>

<div id="tab-settings" class="tab hidden p-4">
<div class="bg-zinc-900 border border-zinc-800 p-5 rounded-2xl">
<h2 class="font-bold">Settings</h2>
<p class="text-xs text-zinc-500 mt-1">Nickname is OPTIONAL. Add only if you want Friends & Chat.</p>
<label class="text-xs text-zinc-400 mt-4 block">Optional Nickname</label>
<input id="nickInput" class="w-full bg-zinc-800 border border-zinc-700 p-3 rounded-xl mt-1" placeholder="e.g. ree123">
<button id="saveNick" class="w-full bg-white text-black py-3 rounded-xl font-bold mt-3">Save Nickname</button>
<p class="text-[11px] text-zinc-600 mt-3">Your ID: <span id="myIdShow"></span></p>
<button onclick="localStorage.clear();location.reload()" class="w-full bg-red-900/30 border border-red-800 py-2 rounded-xl text-xs mt-4">Clear Data</button>
</div>
</div>

<div id="modal" class="fixed inset-0 bg-black/80 hidden p-4 z-50 overflow-y-auto">
<div class="bg-zinc-900 border border-zinc-800 max-w-2xl mx-auto rounded-[24px] p-6"><button onclick="modal.classList.add('hidden')" class="float-right bg-zinc-800 px-3 py-1 rounded-full text-xs">Close X</button><div id="modalContent"></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, doc, setDoc, collection, query, where, getDocs, addDoc, onSnapshot, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig = { apiKey: "AIzaSyBkXIWxfnpjeJRzQTZSMeJa_b11kQ84HG4", authDomain: "studymate-97da1.firebaseapp.com", projectId: "studymate-97da1", storageBucket: "studymate-97da1.firebasestorage.app", messagingSenderId: "943450172085", appId: "1:943450172085:web:d119580c99fd587be0ecfc" };
let db=null; try{ const app=initializeApp(firebaseConfig); db=getFirestore(app);}catch(e){}

const chapters=[
{sem:1,t:"Cell - Unit of Life",e:"🧬",c:"bg-pink-500",short:"37 trillion cells! Membrane gate, Mito powerhouse.",vis:`<div class="bg-black border border-zinc-800 rounded-xl p-3 flex justify-center"><div class="w-36 h-24 border-2 border-pink-400 rounded-full relative"><div class="absolute top-2 left-2 w-8 h-8 bg-violet-500 rounded-full text-[8px] flex items-center justify-center">Nucleus</div><div class="absolute bottom-2 right-2 w-8 h-4 bg-yellow-400 rounded-full text-[7px] text-black flex items-center justify-center">Mito</div></div></div>`,exp:"Cell is basic living unit. Membrane protects, Cytoplasm has organelles, Nucleus controls with DNA.",pts:["Membrane phospholipid bilayer semi-permeable","Mitochondria ATP energy","Nucleus brain DNA","Ribosome makes protein"]},
{sem:1,t:"Tissues",e:"🧫",c:"bg-orange-500",short:"4 types: Epithelial, Connective, Muscular, Nervous.",vis:`<div class="grid grid-cols-3 gap-2 text-[9px] text-center"><div class="bg-black border border-zinc-800 p-2 rounded-xl">Flat<br>⬜<br>Squamous</div><div class="bg-black border border-zinc-800 p-2 rounded-xl">Cube<br>🟦<br>Cuboidal</div><div class="bg-black border border-zinc-800 p-2 rounded-xl">Tall<br>▬<br>Columnar</div></div>`,exp:"Tissue = similar cells doing same work. Epithelium covers.",pts:["Simple 1 layer absorption","Stratified many layers protection","Connective blood bone cartilage","Muscular contractile"]},
{sem:1,t:"Skeletal - 206 Bones",e:"🦴",c:"bg-zinc-200 text-black",short:"Axial 80 + Appendicular 126 = 206",vis:`<div class="bg-black border border-zinc-800 p-3 rounded-xl text-[10px] font-mono">Long Bone<br>Epiphysis spongy<br>Diaphysis shaft<br>Periosteum cover<br>Marrow makes blood</div>`,exp:"Skeleton shape + protection + blood + calcium store. Femur longest.",pts:["Osteoblast builds, Osteoclast breaks","Bone marrow makes RBC","Calcium + Vit D needed","206 bones total"]},
{sem:2,t:"Heart & Blood",e:"❤️",c:"bg-red-600",short:"4 chambers, double circulation, SA node 60-100",vis:`<div class="bg-black border border-zinc-800 p-3 rounded-xl grid grid-cols-2 gap-2 text-[10px] text-center"><div class="bg-red-950 p-2 rounded">RA DeO2</div><div class="bg-red-950 p-2 rounded">LA O2</div><div class="bg-red-900 p-2 rounded font-bold">RV → Lungs</div><div class="bg-red-900 p-2 rounded font-bold">LV → Body</div></div>`,exp:"Heart pumps 5L/min. Right to lungs, left to body. Valves prevent backflow.",pts:["SA node pacemaker","AV node delay","ECG P QRS T","Blood ABO Rh groups"]},
{sem:2,t:"Blood Vessels",e:"🩸",c:"bg-rose-500",short:"Artery away thick, Vein towards thin valves",vis:`<div class="flex gap-2 text-[9px]"><div class="flex-1 bg-red-950 p-2 rounded-xl text-center border border-red-800">ARTERY thick high pressure</div><div class="flex-1 bg-blue-950 p-2 rounded-xl text-center border border-blue-800">VEIN thin valves low pressure</div></div>`,exp:"Artery takes away, Vein brings, Capillary exchange 1 cell thick.",pts:["BP 120/80","Lymph drains extra fluid","Spleen largest lymph organ","Edema fluid retention"]},
{sem:2,t:"Respiratory",e:"🫁",c:"bg-sky-500",short:"480M alveoli, tidal 500ml, surfactant",vis:`<div class="bg-black border border-zinc-800 p-3 rounded-xl text-[10px]">Bronchi → Bronchioles → Alveoli grapes<br>Surfactant prevents collapse<br>Diaphragm contracts = inspiration</div>`,exp:"Nose to alveoli air passage. Alveoli O2/CO2 exchange.",pts:["Tidal 500ml VC 4500ml","Inspiration active","Hemoglobin carries O2","Asthma bronchoconstriction"]},
{sem:3,t:"Digestive 9m Tube",e:"🍔",c:"bg-yellow-400 text-black",short:"Mouth to anus 9m, liver largest gland",vis:`<div class="bg-black border border-zinc-800 p-2 rounded-xl text-[10px]">Mouth amylase → Stomach acid pepsin → Duodenum bile lipase → Jejunum villi absorb → Colon water</div>`,exp:"Breaks food to nutrients. Villi increase area 600x.",pts:["Liver bile fat","Pancreas enzymes + insulin","Villi absorption","Peristalsis moves food"]},
{sem:3,t:"Kidney & Nephron",e:"🫘",c:"bg-amber-600",short:"Filters 180L/day, nephron unit",vis:`<div class="bg-black border border-zinc-800 p-3 rounded-xl text-[9px] font-mono">Glomerulus filter → PCT 65% reabsorb → Loop Henle → DCT → Collecting duct ADH → Urine</div>`,exp:"Kidney filters blood, saves useful, throws waste. GFR 125ml/min.",pts:["GFR 125","ADH saves water","Aldosterone saves Na","Stone calcium oxalate"]},
{sem:4,t:"Endocrine",e:"🧠",c:"bg-purple-500",short:"Pituitary master, feedback thermostat",vis:`<div class="bg-black border border-zinc-800 p-2 rounded-xl text-[10px]">Hypothalamus → Pituitary → Thyroid T3 T4, Adrenal cortisol, Pancreas insulin</div>`,exp:"Ductless hormones into blood. Slow long lasting.",pts:["Thyroid iodine needed","Insulin lowers sugar","Cortisol stress","Oxytocin love labour"]},
{sem:4,t:"Nervous System",e:"🧩",c:"bg-indigo-500",short:"86B neurons, signal 120m/s",vis:`<div class="bg-black border border-zinc-800 p-3 rounded-xl flex gap-2 text-[9px]"><div class="bg-violet-900 p-2 rounded">Dendrite</div><div>→</div><div class="bg-indigo-900 p-2 rounded">Axon</div><div>→</div><div class="bg-zinc-800 p-2 rounded">Synapse</div></div>`,exp:"CNS brain spinal, PNS nerves. Neuron dendrite receives, axon sends.",pts:["Frontal decision","Occipital vision","CSF protects","Sympathetic fight flight"]},
{sem:5,t:"Eye & Ear",e:"👁️",c:"bg-cyan-400 text-black",short:"Rods night, cones color, stapes 3mm smallest",vis:`<div class="grid grid-cols-2 gap-2 text-[9px]"><div class="bg-black border border-zinc-800 p-2 rounded-xl">Eye: Cornea Lens Retina rods cones</div><div class="bg-black border border-zinc-800 p-2 rounded-xl">Ear: Pinna Ossicles Cochlea balance</div></div>`,exp:"Eye focuses light, Ear converts sound.",pts:["Myopia concave","Hyperopia convex","Stapes smallest","Cones color"]},
{sem:5,t:"Reproductive",e:"👶",c:"bg-fuchsia-500",short:"Sperm daily, egg monthly, fertilization tube",vis:`<div class="bg-black border border-zinc-800 p-2 rounded-xl text-[9px]">Day 1-5 mens, 6-13 follicular, 14 ovulation LH surge, 15-28 luteal</div>`,exp:"Testes sperm testosterone, Ovary egg estrogen progesterone.",pts:["Testosterone male","Estrogen female","Ovulation day14","Placenta support"]},
{sem:6,t:"Applied & Homeostasis",e:"⚡",c:"bg-lime-400 text-black",short:"Body keeps constant via feedback",vis:`<div class="bg-black border border-zinc-800 p-3 rounded-xl text-[10px]">High BP → baroreceptor → brain → low HR → normal<br>High sugar → insulin → normal</div>`,exp:"Homeostasis keeps BP sugar temp constant. Disease when fails.",pts:["HTN >140/90","Diabetes high sugar","Negative feedback","Shock low BP"]},
];

let myId=localStorage.getItem('myId')||Math.random().toString(36).substring(2,8);
localStorage.setItem('myId',myId);
let myNick=localStorage.getItem('nick')||"";
let selectedFriend=null;

function init(){
 document.getElementById('myIdShow').innerText=myId;
 document.getElementById('subHead').innerText=myNick?`Hi ${myNick} • Sem 1-6`:"Sem 1 to 6 • Visual • Fun";
 document.getElementById('qrLabel').innerText=myNick||myId;
 document.getElementById('nickInput').value=myNick;
 try{ document.getElementById('myQr').innerHTML=""; new QRCode(document.getElementById('myQr'),{text:myNick||myId,width:110,height:110}); }catch(e){}
 renderGrid('all'); renderQuiz(); renderFlash(); loadFriends();
 if(db){ onSnapshot(query(collection(db,"groupChats","anatomySquad","messages"),orderBy("time","asc")),(s)=>{ const b=document.getElementById('groupMsgs'); b.innerHTML=""; s.forEach(d=>{const m=d.data(); b.innerHTML+=`<div><b class="text-violet-400">${m.nick}:</b> ${m.text}</div>`;}); b.scrollTop=b.scrollHeight; }); }
}
init();

function renderGrid(f){ document.getElementById('grid').innerHTML=chapters.filter(c=>f=="all"||c.sem==f).map((c,i)=>`<div onclick="openC(${chapters.indexOf(c)})" class="bg-zinc-900 border border-zinc-800 p-4 rounded-2xl cursor-pointer"><div class="flex gap-3"><div class="w-10 h-10 rounded-xl ${c.c} flex items-center justify-center">${c.e}</div><div><p class="text-[10px] text-zinc-500">SEM ${c.sem}</p><p class="font-bold text-sm">${c.t}</p><p class="text-xs text-zinc-400 mt-1">${c.short}</p></div></div></div>`).join(''); }
document.querySelectorAll('.sBtn').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sBtn').forEach(x=>x.className="sBtn bg-zinc-800 px-3 py-1 rounded-full text-xs");b.className="sBtn bg-violet-600 px-3 py-1 rounded-full text-xs";renderGrid(b.dataset.sem)});

window.openC=(i)=>{ const c=chapters[i]; document.getElementById('modalContent').innerHTML=`<div class="w-12 h-12 ${c.c} rounded-xl flex items-center justify-center text-xl mb-3">${c.e}</div><h2 class="text-xl font-bold">${c.t}</h2><p class="text-xs text-zinc-500">Sem ${c.sem}</p><div class="mt-4">${c.vis}</div><div class="mt-4"><p class="font-bold text-sm">Explanation:</p><p class="text-sm text-zinc-300 mt-1 leading-6">${c.exp}</p></div><div class="mt-4 space-y-2">${c.pts.map(p=>`<div class="bg-zinc-800 border border-zinc-700 p-3 rounded-xl text-sm">• ${p}</div>`).join('')}</div>`; document.getElementById('modal').classList.remove('hidden'); };

let qi=0; function renderQuiz(){ const c=chapters[qi]; document.getElementById('quizBox').innerHTML=`<p class="text-xs text-zinc-500">Q ${qi+1}/${chapters.length} • ${c.t}</p><p class="font-bold mt-2">Which is TRUE about ${c.t}?</p><div class="mt-4 space-y-2"><button onclick="checkQ(true)" class="w-full text-left bg-zinc-800 p-3 rounded-xl text-sm">✅ ${c.pts[0]}</button><button onclick="checkQ(false)" class="w-full text-left bg-zinc-800 p-3 rounded-xl text-sm">❌ No function</button><button onclick="checkQ(false)" class="w-full text-left bg-zinc-800 p-3 rounded-xl text-sm">❌ Only in plants</button></div><div class="mt-4 flex gap-2"><button onclick="qi=(qi-1+chapters.length)%chapters.length;renderQuiz()" class="bg-zinc-800 px-4 py-2 rounded-full text-xs">Prev</button><button onclick="qi=(qi+1)%chapters.length;renderQuiz()" class="bg-zinc-800 px-4 py-2 rounded-full text-xs">Next</button></div>`; } window.checkQ=(ok)=>{ alert(ok?"✅ Correct!":"❌ Wrong"); if(ok){ qi=(qi+1)%chapters.length; renderQuiz(); } };
function renderFlash(){ document.getElementById('flashBox').innerHTML=chapters.map(c=>`<div onclick="this.querySelector('.ans').classList.toggle('hidden')" class="bg-zinc-900 border border-zinc-800 rounded-2xl p-4 cursor-pointer"><p class="font-bold text-sm">${c.e} ${c.t}</p><p class="text-xs text-zinc-500 mt-1">Tap to reveal</p><div class="ans hidden mt-3 bg-violet-600 p-3 rounded-xl text-sm">${c.pts[0]}<br><br><span class="text-[10px] opacity-80">${c.exp}</span></div></div>`).join(''); }

window.showTab=(tab)=>{ document.querySelectorAll('.tabBtn').forEach(b=>b.className="tabBtn bg-zinc-800 px-4 py-2 rounded-full text-sm"); document.querySelector(`[data-tab="${tab}"]`).className="tabBtn bg-white text-black px-4 py-2 rounded-full text-sm font-bold"; document.querySelectorAll('.tab').forEach(t=>t.classList.add('hidden')); document.getElementById('tab-'+tab).classList.remove('hidden'); };
document.querySelectorAll('.tabBtn').forEach(b=>b.onclick=()=>showTab(b.dataset.tab));

document.getElementById('saveNick').onclick=async()=>{
 let n=document.getElementById('nickInput').value.trim().toLowerCase().replace(/\s/g,'');
 if(n && n.length<3) return alert("Min 3 letters");
 if(n && db){ try{ const q=await getDocs(query(collection(db,"users"),where("nickname","==",n))); if(!q.empty && q.docs[0].data().uid!==myId) return alert("Taken, try "+n+"123"); }catch(e){} }
 myNick=n; localStorage.setItem('nick',myNick);
 if(db && myNick){ try{ await setDoc(doc(db,"users",myId),{uid:myId,nickname:myNick,createdAt:serverTimestamp()},{merge:true}); }catch(e){} }
 init(); alert(n?"Saved: "+n:"Nickname removed");
};

async function loadFriends(){
 const local=JSON.parse(localStorage.getItem('friends')||"[]");
 const list=document.getElementById('friendsList');
 if(local.length==0) list.innerHTML="No friends yet. Search or scan QR.";
 else list.innerHTML=local.map(f=>`<div class="flex justify-between bg-zinc-800 p-3 rounded-xl mb-2"><span>${f.nickname}</span><button onclick="openPrivate('${f.uid}','${f.nickname}')" class="text-violet-400 text-xs font-bold">Chat →</button></div>`).join('');
 if(db){ try{ const snap=await getDocs(collection(db,"users",myId,"friends")); if(!snap.empty){ const arr=[]; snap.forEach(d=>arr.push(d.data())); localStorage.setItem('friends',JSON.stringify(arr)); loadFriends(); } }catch(e){} }
}
window.addFriend=async(uid,nick)=>{
 const arr=JSON.parse(localStorage.getItem('friends')||"[]");
 if(!arr.find(f=>f.uid==uid)) arr.push({uid,nickname:nick});
 localStorage.setItem('friends',JSON.stringify(arr));
 if(db){ try{ await setDoc(doc(db,"users",myId,"friends",uid),{uid,nickname:nick,addedAt:serverTimestamp()}); }catch(e){} }
 alert("Added "+nick); loadFriends();
};
document.getElementById('searchBtn').onclick=async()=>{
 const n=document.getElementById('searchInput').value.trim().toLowerCase(); if(!n) return;
 if(!db) return alert("Search needs https. Your github.io link already is https, so it will work!");
 const snap=await getDocs(query(collection(db,"users"),where("nickname","==",n)));
 const res=document.getElementById('searchRes'); res.innerHTML="";
 if(snap.empty) res.innerHTML="<p class='text-xs text-zinc-500'>No user found</p>";
 snap.forEach(d=>{ const u=d.data(); if(u.uid==myId) return; res.innerHTML+=`<div class="flex justify-between items-center bg-zinc-800 p-3 rounded-xl"><span class="text-sm">${u.nickname}</span><button onclick="addFriend('${u.uid}','${u.nickname}')" class="bg-violet-600 px-3 py-1 rounded-full text-xs font-bold">Add</button></div>`; });
};
document.getElementById('scanBtn').onclick=()=>{
 document.getElementById('reader').classList.remove('hidden');
 const qr=new Html5Qrcode("reader");
 qr.start({facingMode:"environment"},{fps:10,qrbox:250},async(decoded)=>{
  await qr.stop(); document.getElementById('reader').classList.add('hidden');
  if(db){ document.getElementById('searchInput').value=decoded; document.getElementById('searchBtn').click(); } else addFriend('id_'+decoded,decoded);
 },()=>{});
};
document.getElementById('groupSend').onclick=async()=>{
 const t=document.getElementById('groupInput').value.trim(); if(!t) return;
 if(db){ await addDoc(collection(db,"groupChats","anatomySquad","messages"),{text:t,nick:myNick||myId,uid:myId,time:serverTimestamp()}); }
 document.getElementById('groupInput').value="";
};
window.openPrivate=(uid,nick)=>{
 selectedFriend=uid; document.getElementById('privateWith').innerText=nick;
 if(db){ onSnapshot(query(collection(db,"privateChats",[myId,uid].sort().join('_'),"messages"),orderBy("time","asc")),(s)=>{ const b=document.getElementById('privateMsgs'); b.innerHTML=""; s.forEach(d=>{const m=d.data(); const me=m.uid==myId; b.innerHTML+=`<div class="${me?'text-right':''}"><span class="inline-block px-3 py-1 rounded-xl text-xs ${me?'bg-violet-600':'bg-zinc-800'}">${m.text}</span></div>`;}); b.scrollTop=b.scrollHeight; }); }
 showTab('chat');
};
document.getElementById('privateSend').onclick=async()=>{
 if(!selectedFriend) return alert("Select friend first");
 const t=document.getElementById('privateInput').value.trim(); if(!t) return;
 if(db){ await addDoc(collection(db,"privateChats",[myId,selectedFriend].sort().join('_'),"messages"),{text:t,uid:myId,time:serverTimestamp()}); }
 document.getElementById('privateInput').value="";
};
</script>
</body>
</html>
